[legs]
# You can add legs here by copying existing legs,
# changing the name of the leg (in [legs.go_to_work], go_to_work is
# the name of the leg) and changing the relevant values
# Note that you need to change the leg name in all parts where it occurs
# (i.e. also in [legs.go_to_work.locations],[legs.go_to_work.road_types],
# etc.
[legs.go_to_work]
reference = 'home_work'
start_location = 'home'
end_location = 'work'

[legs.come_from_work]
reference = 'home_work'
start_location = 'work'
end_location = 'home'


[legs.home_to_leisure]
reference = 'home_leisure'
start_location = 'home'
end_location = 'leisure'


[legs.leisure_to_home]
reference = 'home_leisure'
start_location = 'leisure'
end_location = 'home'



[legs.work_to_leisure]
reference = 'work_leisure'
start_location = 'work'
end_location = 'leisure'


[legs.leisure_to_work]
reference = 'work_leisure'
start_location = 'leisure'
end_location = 'work'


[legs.holiday_to_leisure]
reference = 'holiday_leisure'
start_location = 'holiday'
end_location = 'leisure'


[legs.leisure_to_holiday]
reference = 'holiday_leisure'
start_location = 'leisure'
end_location = 'holiday'


[legs.home_to_weekend]
