
[plots]

[plots.charge_trigger]
style = 'fivethirtyeight'
figure_width = 16
figure_height = 9
x_ticks = [0, 0.25, 0.5, 0.75, 1.0]
xtick_labels = ['Empty', 'Charge trigger', 'Midpoint', 'Charge stop', 'Full']
x_label = 'Battery charge levels'
x_max = 1.0
y_ticks = [0, 1]
ytick_labels = ['0', 'Reference price']
y_label = 'Charge price'
y_max = 100.0
want_charge_color = 'TNO_action_blue'
not_want_charge_color = 'TNO_action_orange'
charge_trigger = 0.25
stop_trigger = 0.75
steps=1_000
line_color = 'TNO_ink'

# Inset position and range
inset_bounds = [0.57, 0.53, 0.40, 0.40]
inset_x_min = 0.2
inset_x_max = 0.9
inset_y_max = 2.0

inset_want_charge_color = 'TNO_action_blue'
inset_not_want_charge_color = 'TNO_action_orange'
inset_margin = 0.015
inset_background_color = 'TNO_white'
# Inset appearance
inset_fontsize = 8
inset_border_width = 1.0

# Move legend away from inset
legend_location = 'upper left'



# File-related parameters
[files]
# General parameters
input_root = 'input'
output_root = 'output'
# For files that group data (such as (sqlite) databases or Excel workbooks)
groupfile_root = 'ChaProEV'

[files.figures]
# Parameters for plots/figures
dpi = 240
# Indicate below if you want to save your (Matplotlib) figures
# In the given formats, and the dpi you want to use (common for all)
[files.figures.outputs]
png = true
pdf = true
svg = true
eps = true



