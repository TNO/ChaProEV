name: Publish package to PyPI

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml

permissions:
  contents: read

jobs:
  check_version:
    name: Check whether the package version changed
    runs-on: ubuntu-latest

    outputs:
      version_changed: ${{ steps.version_check.outputs.version_changed }}
      package_version: ${{ steps.version_check.outputs.package_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check project version
        id: version_check
        shell: bash
        run: |
          new_version="$(
            python -c "
          import tomllib
          from pathlib import Path

          with Path('pyproject.toml').open('rb') as file:
              pyproject = tomllib.load(file)

          print(pyproject['project']['version'])
          "
          )"

          old_version="$(
            git show HEAD^:pyproject.toml |
            python -c "
          import sys
          import tomllib

          pyproject = tomllib.loads(sys.stdin.read())
          print(pyproject['project']['version'])
          "
          )"

          echo "Previous version: ${old_version}"
          echo "Current version: ${new_version}"

          echo "package_version=${new_version}" >> "${GITHUB_OUTPUT}"

          if [ "${new_version}" = "${old_version}" ]; then
            echo "The package version did not change."
            echo "version_changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "The package version changed."
            echo "version_changed=true" >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: Build package distributions
    needs:
      - check_version

    if: needs.check_version.outputs.version_changed == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Remove previous build outputs
        run: |
          rm -rf build dist
          find . -type d -name '*.egg-info' -prune -exec rm -rf {} +

      - name: Build source distribution and wheel
        run: |
          python -m build

      - name: Check package distributions
        run: |
          python -m twine check dist/*

      - name: Show generated distributions
        run: |
          ls -lh dist

      - name: Upload package distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish package to PyPI
    needs:
      - check_version
      - build

    if: needs.check_version.outputs.version_changed == 'true'

    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1